spring.application.name=springboot_photo
server.port=8080
# 让 OPTIONS 预检进入 DispatcherServlet，避免跨域 POST 被当成「找静态文件」而 404
spring.mvc.dispatch-options-request=true
spring.datasource.url=jdbc:mysql://localhost:3306/photo_blog?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=Mcl12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 全量 SQL 打日志会严重拖慢列表接口（作品流等）；需要排错时再改为 true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# ??????????
spring.jpa.hibernate.ddl-auto=update

# 作品图片根目录见 application.yml（UTF-8），勿在此 .properties 写中文路径以免乱码目录。
# 返回 JSON 里拼接图片 URL 用（与浏览器访问端口一致）
app.public-base-url=http://localhost:8080
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# JWT（HS256 密钥须足够长，生产环境请改为环境变量注入）
jwt.secret=PhotoBlogJwtSecretKeyMustBeAtLeast32CharactersLongForHS256
jwt.expiration-ms=604800000

# Redis（默认无密码；有密码请写在 application-local.properties）
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=3s

# QQ SMTP（账号与授权码只写在 application-local.properties，避免被本文件末尾空占位覆盖）
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.qq.com
spring.mail.default-encoding=UTF-8

# 必须最后加载，否则会覆盖上面的邮箱/Redis 等本地密钥
spring.config.import=optional:classpath:application-local.properties

spring-boot.run.jvmArguments=-Dfile.encoding=UTF-8