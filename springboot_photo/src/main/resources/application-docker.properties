# Docker production profile (SPRING_PROFILES_ACTIVE=docker)
# Secrets are injected via docker-compose environment variables; do not put real passwords here.

server.port=8080

spring.datasource.url=jdbc:mysql://mysql:3306/photo_blog?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=3s

app.public-base-url=${APP_PUBLIC_BASE_URL}
app.upload.root=${APP_UPLOAD_ROOT:/data/Photo_base}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=604800000

spring.mail.host=smtp.qq.com
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.qq.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
# If port 465 is blocked by cloud provider, set SPRING_MAIL_PORT=587 and STARTTLS flags in .env
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:false}

app.vision.providers.doubao.api-key=${DOUBAO_API_KEY:}

# Same-origin via Nginx in production; * allows direct :8080 debugging if needed
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:*}
