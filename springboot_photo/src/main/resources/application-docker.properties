# Docker 生产配置（SPRING_PROFILES_ACTIVE=docker）
# 密钥由 docker-compose 环境变量注入，勿在此写真实密码

server.port=8080

spring.datasource.url=jdbc:mysql://mysql:3306/photo_blog?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=3s

app.public-base-url=${APP_PUBLIC_BASE_URL}
app.upload.root=${APP_UPLOAD_ROOT:/data/Photo_base}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=604800000

spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.qq.com
spring.mail.default-encoding=UTF-8

app.vision.providers.doubao.api-key=${DOUBAO_API_KEY:}

# 生产经 Nginx 同源访问；保留 * 便于直接调 8080 排错
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:*}
