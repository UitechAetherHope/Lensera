name: lensera

# Lensera 生产编排：对外仅 80 端口（HTTP + 公网 IP）
# 使用：cp .env.example .env && 编辑 .env && 同步 Photo_base 到 data/Photo_base && docker compose up -d --build

services:
  mysql:
    image: mysql:8.0
    container_name: lensera-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: photo_blog
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/sql/photo_blog.sql:/docker-entrypoint-initdb.d/01-photo_blog.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - lensera

  redis:
    image: redis:7-alpine
    container_name: lensera-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - lensera

  api:
    build:
      context: ./springboot_photo
      dockerfile: Dockerfile
    container_name: lensera-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: docker
      APP_UPLOAD_ROOT: /data/Photo_base
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
    volumes:
      - ${PHOTO_BASE_HOST_PATH:-./data/Photo_base}:/data/Photo_base
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/blog-posts/feed?sort=latest >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - lensera

  web:
    build:
      context: ./cover
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: lensera-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lensera

volumes:
  mysql_data:
  redis_data:

networks:
  lensera:
    driver: bridge
